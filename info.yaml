# Tiny Tapeout project information
project:
  title:        "MAC Unit AI Inference Accelerator"
  author:       "Marian Topor"
  discord:      ""
  description:  "Signed INT8 multiply-accumulate unit — fundamental building block of neural networks"
  language:     "Verilog"
  clock_hz:     50000000

  # 947 gates, fits comfortably in 1x1 tile
  tiles: "1x1"

  top_module:  "tt_um_mariana_mac"

  source_files:
    - "project.v"

# Pinout
pinout:
  # Inputs (8-bit data bus)
  ui[0]: "data_in[0] - LSB of weight or activation"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7] - MSB sign bit (INT8)"

  # Outputs (8-bit accumulator readout)
  uo[0]: "acc_out[0] - byte-selected accumulator"
  uo[1]: "acc_out[1]"
  uo[2]: "acc_out[2]"
  uo[3]: "acc_out[3]"
  uo[4]: "acc_out[4]"
  uo[5]: "acc_out[5]"
  uo[6]: "acc_out[6]"
  uo[7]: "acc_out[7]"

  # Bidirectional pins
  uio[0]: "load_weight - latch ui_in as weight (input)"
  uio[1]: "compute - rising edge triggers MAC (input)"
  uio[2]: "clear - clear accumulator (input)"
  uio[3]: "byte_sel - 0=acc[7:0], 1=acc[15:8] (input)"
  uio[4]: "overflow - arithmetic overflow flag (output)"
  uio[5]: "done - MAC operation complete (output)"
  uio[6]: "sign - accumulator sign bit (output)"
  uio[7]: "unused"

# Do not change!
yaml_version: 6
